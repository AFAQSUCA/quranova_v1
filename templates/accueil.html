{% load static %}<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QURANOVA</title>
  <link rel="icon" href="{% static 'img/favicon.png' %}">
  <link rel="stylesheet" href="{% static 'css/charte.css' %}">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fff; color: var(--q-texte);
           font-family: system-ui, "Segoe UI", sans-serif; }
    main { text-align: center; padding: 2rem; max-width: 36rem; }
    main h1 { margin: 0; }
    main img { width: min(70vw, 22rem); height: auto; }
    p { font-size: 1.1rem; }
    a.bouton { display: inline-flex; align-items: center; margin-top: 1rem; padding: .9rem 1.8rem; min-height: 3rem; background: var(--q-vert); color: #fff;
               text-decoration: none; border-radius: .6rem; border-bottom: .3rem solid var(--q-or); font-weight: 700; }
    a.bouton:hover, a.bouton:focus-visible { background: var(--q-vert-fonce); }
  </style>
</head>
<body>
  <main>
    <h1><img src="{% static 'img/quranova-logo.png' %}" alt="QURANOVA — plateforme de gestion des concours du Saint Coran"></h1>
    <p>Serveur de salle QURANOVA.</p>
    <a class="bouton" href="{% url 'admin:index' %}">Accéder à l'administration</a>
  </main>
</body>
</html>
