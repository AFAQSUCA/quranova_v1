# Nginx du serveur de salle : sert les fichiers statiques et les logos, relaie le reste (HTTP + WebSocket) vers Daphne.
map $http_upgrade $connexion_amont {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 10m;          # formulaires de consentement téléversés
    server_tokens off;

    location /static/ {
        alias /usr/share/nginx/quranova/static/;
        expires 1h;
        access_log off;
    }

    location /media/ {
        alias /usr/share/nginx/quranova/media/;
    }

    # WebSocket du diaporama : connexion longue (le cœur de la présentation bat toutes les 15 s).
    location /ws/ {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connexion_amont;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}
